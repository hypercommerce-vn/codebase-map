# HC-AI | ticket: FDD-TOOL-CODEMAP
# Codebase Map website.
# - VPS: deploy.sh --setup installs this as /etc/nginx/sites-available/codebase-map,
#   replacing cbm.example.com with $DOMAIN. Then: sudo certbot --nginx -d $DOMAIN
# - Docker: website/Dockerfile copies it to /etc/nginx/conf.d/default.conf.

# The embedded demo map (/demo/) is CBM's single-file HTML export with inline
# scripts and styles; every other page loads only same-origin files.
map $uri $cbm_csp {
    default  "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/demo/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";
}

server {
    listen 80;
    listen [::]:80;
    server_name cbm.example.com;

    root /var/www/codebase-map;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Keep /en -> /en/ redirects relative so they survive Docker port maps and proxies.
    absolute_redirect off;

    add_header Content-Security-Policy $cbm_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Browsers ignore this over plain HTTP; it takes effect once certbot (or the
    # reverse proxy in front of Docker) serves the site over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Hidden files (such as deploy.sh's web-root marker) are never served;
    # /.well-known/ stays reachable for security.txt and ACME challenges.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # styles.css, site.js and favicon.svg are referenced with ?v=<content hash>.
    location ~* \.(?:css|js|svg)$ {
        try_files $uri =404;
        expires 30d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
